services:
  postgres:
    image: postgres:15
    container_name: resume-auto-updater-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume_auto_updater
    volumes:
      - resume_pg_data:/var/lib/postgresql/data

volumes:
  resume_pg_data:
